<style>
:root{--navy:#132238;--orange:#f47b20;--orange-dark:#d9630c;--bg:#f7f8fa;--white:#fff;--line:#e5e9ee;--muted:#687588;--danger:#c63d3d;--success:#16835b;--shadow:0 12px 32px rgba(20,38,61,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.container{width:min(1180px,calc(100% - 36px));margin:auto}.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:20}.header .container{display:flex;align-items:center;justify-content:space-between}.brand img{width:130px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:var(--orange);color:#fff}.primary:hover{background:var(--orange-dark)}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:#fff;color:var(--danger);border:1px solid #efd5d5}.admin-main{padding:34px 0 70px}.title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:800}.title h1{margin:5px 0 7px;font-size:34px}.muted{color:var(--muted)}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid transparent;background:transparent;color:#566477;padding:10px 13px;border-radius:8px;font-weight:700}.tabs button:hover,.tabs button.active{background:#fff;border-color:var(--line);color:var(--navy)}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.section-head h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}.stat .value{font-size:29px;font-weight:800;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#f0f3f6;font-size:11px;font-weight:800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce2e8;border-radius:8px;padding:11px 12px;background:#fff;color:var(--navy);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#efaa74;box-shadow:0 0 0 3px rgba(244,123,32,.1)}.modal{position:fixed;inset:0;background:rgba(15,25,38,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.modal-head h2{margin:0}.close{border:0;background:#f1f3f5;border-radius:8px;padding:7px 10px}.preview{margin-top:8px;border:1px dashed var(--line);border-radius:9px;min-height:80px;display:grid;place-items:center;overflow:hidden;color:var(--muted)}.preview img{width:100%;height:130px;object-fit:cover}.empty{padding:38px 20px;text-align:center;color:var(--muted);border:1px dashed #dce2e8;border-radius:10px}.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:13px}.toast.show{display:block}.mi{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}.brand{display:flex;align-items:center}.brand img{height:34px;width:auto;object-fit:contain}.hero{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.hero h1{margin:4px 0 8px}.hero-icon{width:58px;height:58px;border-radius:14px;background:#fff3e8;color:var(--orange);display:grid;place-items:center}.hero-icon .mi{font-size:30px}.stat{position:relative;min-height:125px}.stat-icon{width:38px;height:38px;border-radius:10px;background:#fff3e8;color:var(--orange);display:grid;place-items:center;margin-bottom:10px}.stat-icon .mi{font-size:22px}.preview{background:#fafbfc}.upload-box{border:1px dashed #cfd7df;border-radius:10px;padding:14px}.upload-box input[type=file]{width:100%}.hint{font-size:12px;color:var(--muted);margin-top:6px}.course-thumb{width:54px;height:38px;border-radius:7px;object-fit:cover;background:#eef1f4}.row-title{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;padding:0}.tabs button{display:inline-flex;align-items:center;gap:7px}@media(max-width:760px){.container{width:min(100% - 24px,1180px)}.title{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.admin-main{padding-top:24px}.tabs{overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.tabs button{white-space:nowrap}}

.resource-list{display:grid;gap:10px;margin-top:14px}.resource-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid #e6eaf0;border-radius:12px;background:#fff}.resource-info{min-width:0}.resource-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.resource-meta{font-size:12px;color:#7a8494;margin-top:4px}.resource-empty{padding:18px;text-align:center;border:1px dashed #d7dde7;border-radius:12px;color:#7a8494}.progress-wrap{margin-top:14px;background:#eef2f7;border-radius:999px;height:9px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--orange);transition:width .2s}.resource-success{color:#138a52;font-weight:700;font-size:13px;margin-top:10px}.resource-error{color:#c93636;font-weight:700;font-size:13px;margin-top:10px}
.resource-upload-card{border:1px solid #e7ebf0;border-radius:16px;padding:16px;background:#fbfcfd}.resource-name-input{margin-bottom:12px}.resource-name-input label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}.resource-name-input input{width:100%;border:1px solid #dce2e8;border-radius:10px;padding:12px;background:#fff;color:var(--navy);outline:none}.resource-name-input input:focus{border-color:#efaa74;box-shadow:0 0 0 3px rgba(244,123,32,.1)}.resource-file-picker{display:flex;align-items:center;gap:10px;border:1px dashed #cbd4df;border-radius:12px;padding:10px;background:#fff;cursor:pointer}.resource-file-picker input{display:none}.resource-file-icon{width:42px;height:42px;border-radius:10px;background:#fff3e8;color:var(--orange);display:grid;place-items:center;flex:none}.resource-file-copy{min-width:0}.resource-file-copy strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.resource-file-copy span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.resource-upload-actions{display:flex;justify-content:flex-end;margin-top:12px}.resource-item{padding:12px 13px}.resource-item .resource-name{font-size:13px}.resource-item .actions{flex:none}.resource-item .btn{padding:9px 12px}.resource-item .btn .mi{font-size:18px}@media(max-width:600px){.resource-item{align-items:flex-start;flex-direction:column}.resource-item .actions{width:100%}.resource-item .actions .btn{flex:1}.resource-upload-actions .btn{width:100%}}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}.crumbs button{border:0;background:transparent;color:var(--orange);font-weight:700;padding:4px 6px;border-radius:6px}.crumbs button:hover{background:#fff3e8}.crumbs .sep{font-size:18px}.crumbs>span:last-child{color:var(--navy);font-weight:700}
.row-click{cursor:pointer}.row-click:hover{background:#fafbfc}
.badge.ok{background:#e6f6ef;color:var(--success)}.badge.warn{background:#fff3e8;color:var(--orange-dark)}.badge.bad{background:#fdeeee;color:var(--danger)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.info-grid .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:4px}.info-grid .v{font-size:14px;font-weight:600;word-break:break-word}
.search-box{position:relative;margin-bottom:14px}.search-box input{width:100%;border:1px solid #dce2e8;border-radius:10px;padding:12px 14px 12px 42px;outline:none}.search-box input:focus{border-color:#efaa74;box-shadow:0 0 0 3px rgba(244,123,32,.1)}.search-box .mi{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.acc-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.acc-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.acc-card details{margin-top:10px}.acc-card summary{cursor:pointer;font-weight:700;font-size:13px}.acc-lesson{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.panel+.panel{margin-top:14px}.btn.sm{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header class="header"><div class="container"><a class="brand" href="admin.html"><img src="logo.png" alt="DOPAMINE"></a><button class="btn secondary" onclick="location.href='index.html'"><span class="mi">open_in_new</span>Website</button></div></header>
<main class="admin-main"><div class="container">
<div class="title"><div><div class="eyebrow">Administration</div><h1>DOPAMINE Admin</h1><div class="muted">Simple management for students, courses, lessons and platform messages.</div></div></div>

<nav class="tabs" id="tabs"></nav><div id="content"></div>
<div style="margin-top:60px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end"><button class="btn danger" onclick="location.href='danger.html'"><span class="mi">warning</span>Danger Zone</button></div>
</div></main><div id="modal" class="modal"></div><div id="toast" class="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,serverTimestamp,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDD1_ssoVaIyIfwYAs7jT_g0pFdr1IlI",authDomain:"dorar-17b10.firebaseapp.com",projectId:"dorar-17b10",storageBucket:"dorar-17b10.firebasestorage.app",messagingSenderId:"740800324300",appId:"1:740800324300:web:cd819b2910a53475af5869"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const DOCUMENT_UPLOAD_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyfokYL63LhXhWWsw46X1799Jsa20i9RBMlh4fcoj_fEdbp35HoVa9S2F_I-gqfgzL3Cg/exec';

/* ---------- Structure: Courses > Course > Lesson > Parts | Students > Student ---------- */
const sections=[['overview','Overview','dashboard'],['courses','Courses','school'],['students','Students','group'],['payments','Payments','payments'],['contact','Contact','contact_support']];
let active='overview';
let view={name:'overview'};
const enc=encodeURIComponent,dec=decodeURIComponent;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function generateNumericCode(length=6){let out='';for(let i=0;i<length;i++)out+=Math.floor(Math.random()*10);return out}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function loading(){return '<div class="panel"><div class="empty">Loading...</div></div>'}
function date(v){try{if(!v)return '—';const d=v.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString()}catch{return '—'}}
function dateValue(v){try{return v?.toMillis?v.toMillis():new Date(v||0).getTime()||0}catch{return 0}}
function modal(title,html){$('modal').innerHTML=`<div class="modal-box"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html}</div>`;$('modal').classList.add('open')}
window.closeModal=()=>{$('modal').classList.remove('open');$('modal').innerHTML=''};
function crumbs(items){return `<div class="crumbs">${items.map(([l,a],i)=>(a?`<button onclick="${a}">${esc(l)}</button>`:`<span>${esc(l)}</span>`)+(i<items.length-1?'<span class="mi sep">chevron_right</span>':'')).join('')}</div>`}
function modeOf(c){return c.accessMode||(c.isPaid?'paid':'free')}
function modeLabel(c){const m=modeOf(c);return m==='paid'?'Paid · '+Number(c.price||0).toFixed(2)+' EGP':m==='session_code'?'Code for each lesson':m==='course_code'?'Code for whole course':'Free'}
function ytId(value){const s=String(value||'').trim();if(!s)return '';if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;try{const u=new URL(s);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const p=u.pathname.split('/');if(['embed','shorts','live'].includes(p[1]))return p[2]||''}}catch(e){}return ''}
async function hashPassword(p){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function compressImage(file,maxBytes=700*1024,maxDimension=1200){if(file.size<=maxBytes)return file;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=data});let scale=Math.min(1,maxDimension/Math.max(img.width,img.height));let w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));let q=.86;for(let n=0;n<8;n++){const can=document.createElement('canvas');can.width=w;can.height=h;can.getContext('2d').drawImage(img,0,0,w,h);const blob=await new Promise(r=>can.toBlob(r,'image/jpeg',q));if(blob.size<=maxBytes)return blob;q-=.08;if(q<.45){w=Math.round(w*.85);h=Math.round(h*.85);q=.72}}return new Blob([data],{type:'image/jpeg'})}
async function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

async function fetchLessons(cid){return (await getDocs(collection(db,'courses',cid,'lessons'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))}
async function fetchHomework(cid){return (await getDocs(collection(db,'courses',cid,'homework'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))}
let curKind='lessons';
async function fetchQuizzes(cid){return (await getDocs(collection(db,'courses',cid,'quizzes'))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0))}

/* ---------- Navigation ---------- */
function renderTabs(){$('tabs').innerHTML=sections.map(([k,l,i])=>`<button class="${active===k?'active':''}" onclick="load('${k}')"><span class="mi">${i}</span>${l}</button>`).join('')}
async function guard(tab,fn){active=tab;renderTabs();$('content').innerHTML=loading();try{await fn()}catch(e){console.error(e);$('content').innerHTML='<div class="panel"><div class="empty">Something went wrong. Please try again.</div></div>'}}
window.load=s=>{view={name:s};return guard(s,()=>({overview,students,courses,payments,contact})[s]())};
window.openCourse=e=>guard('courses',()=>coursePage(dec(e)));
window.openLesson=(a,b,k)=>{curKind=k==='homework'?'homework':'lessons';return guard('courses',()=>lessonPage(dec(a),dec(b)))};
window.openStudent=e=>guard('students',()=>studentPage(dec(e)));
async function refresh(){const v=view;try{if(v.name==='course')await coursePage(v.cid);else if(v.name==='lesson')await lessonPage(v.cid,v.lid);else if(v.name==='student')await studentPage(v.sid);else await load(active)}catch(e){console.error(e);toast('Something went wrong.')}}

/* ---------- Overview ---------- */
async function overview(){
  const [users,cs]=await Promise.all([getDocs(collection(db,'users')),getDocs(collection(db,'courses'))]);
  const students=users.docs.filter(d=>d.data().role==='student').length;
  const lessonCounts=await Promise.all(cs.docs.map(async d=>(await getDocs(collection(db,'courses',d.id,'lessons'))).size));
  const total=lessonCounts.reduce((a,b)=>a+b,0);
  $('content').innerHTML=`<div class="grid"><div class="stat"><div class="stat-icon"><span class="mi">group</span></div><div class="label">Students</div><div class="value">${students}</div></div><div class="stat"><div class="stat-icon"><span class="mi">school</span></div><div class="label">Courses</div><div class="value">${cs.size}</div></div><div class="stat"><div class="stat-icon"><span class="mi">menu_book</span></div><div class="label">Lessons</div><div class="value">${total}</div></div></div><div class="panel" style="margin-top:14px"><div class="section-head"><div><h2>Quick actions</h2><div class="muted">Open the area you need.</div></div><span class="mi">bolt</span></div><div class="actions"><button class="btn primary" onclick="load('courses')"><span class="mi">school</span>Courses</button><button class="btn secondary" onclick="load('students')"><span class="mi">group</span>Students</button><button class="btn secondary" onclick="load('payments')"><span class="mi">payments</span>Payments</button></div></div>`;
}

/* ---------- Courses list ---------- */
async function courses(){
  const snap=await getDocs(collection(db,'courses'));
  const rows=await Promise.all(snap.docs.map(async d=>({id:d.id,...d.data(),lessonCount:(await getDocs(collection(db,'courses',d.id,'lessons'))).size})));
  rows.sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt));
  $('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Courses</h2><div class="muted">Open a course to manage its lessons and quizzes.</div></div><button class="btn primary" onclick="newCourse()"><span class="mi">add</span>Add Course</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Course</th><th>Access</th><th>Lessons</th><th>Created</th><th></th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr class="row-click" onclick="openCourse('${enc(c.id)}')"><td><div class="row-title">${c.thumbnailBase64||c.thumbnailUrl?`<img class="course-thumb" src="${esc(c.thumbnailBase64||c.thumbnailUrl)}" alt="">`:''}<div><strong>${esc(c.title||'Untitled')}</strong><br><span class="muted">${esc((c.description||'').slice(0,80))}</span></div></div></td><td><span class="badge">${esc(modeLabel(c))}</span></td><td>${c.lessonCount}</td><td>${date(c.createdAt)}</td><td><div class="actions" onclick="event.stopPropagation()"><button class="btn secondary" onclick="openCourse('${enc(c.id)}')"><span class="mi">folder_open</span>Open</button><button class="btn danger" onclick="deleteCourse('${enc(c.id)}')"><span class="mi">delete</span></button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No courses yet.</div></td></tr>`}</tbody></table></div></div>`;
}
function courseForm(c={},cid=''){
  modal(cid?'Edit Course':'Add Course',`<form id="course-form"><div class="field"><label>Course Name</label><input id="ct" value="${esc(c.title||'')}" required></div><div class="field"><label>Description</label><textarea id="cd">${esc(c.description||'')}</textarea></div><div class="field"><label>Access / Payment Type</label><select id="cpaid"><option value="free" ${modeOf(c)==='free'?'selected':''}>Free</option><option value="paid" ${modeOf(c)==='paid'?'selected':''}>Paid (Vodafone Cash / InstaPay)</option><option value="session_code" ${c.accessMode==='session_code'?'selected':''}>Enter with code — session by session</option><option value="course_code" ${c.accessMode==='course_code'?'selected':''}>Enter with code — entire course</option></select><div class="hint">Session codes are set inside each lesson.</div></div><div class="field" id="price-field" style="display:${modeOf(c)==='paid'?'block':'none'}"><label>Amount (EGP)</label><input id="cprice" type="number" min="0" step="0.01" value="${Number(c.price)||''}"></div><div class="field" id="course-code-field" style="display:${c.accessMode==='course_code'?'block':'none'}"><label>Course access code (numbers only)</label><div style="display:flex;gap:8px"><input id="course-code-value" inputmode="numeric" pattern="[0-9]*" maxlength="12" value="${esc(c.courseAccessCode||generateNumericCode(8))}" readonly><button type="button" class="btn secondary" id="regen-course-code">Generate new</button><button type="button" class="btn secondary" id="copy-course-code">Copy</button></div><div class="hint">This code unlocks every lesson in the course.</div></div><div class="field full upload-box"><label>Course Image</label><input id="ci" type="file" accept="image/*"><div class="hint">Images over 1 MB are compressed before saving.</div><div id="cip" class="preview">${c.thumbnailBase64||c.thumbnailUrl?`<img src="${esc(c.thumbnailBase64||c.thumbnailUrl)}">`:'Choose an image'}</div></div><div class="actions"><button class="btn primary"><span class="mi">save</span>Save Course</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
  $('cpaid').onchange=()=>{$('price-field').style.display=$('cpaid').value==='paid'?'block':'none';$('course-code-field').style.display=$('cpaid').value==='course_code'?'block':'none'};

  modal(lid?(hw?'Edit Homework':'Edit Lesson'):(hw?'Add Homework':'Add Lesson'),`<form id="lesson-form"><div class="field"><label>${hw?'Homework Name':'Lesson Name'}</label><input id="lt" value="${esc(l.title||'')}" required></div><div class="field"><label>Order</label><input id="lo" type="number" min="1" value="${Number(l.order)||1}" required></div><div class="field"><label>Main video link (optional)</label><input id="lv" value="${esc(l.videoId||l.youtubeVideoId||l.youtubeUrl||'')}" placeholder="YouTube link"><div class="hint">Leave empty if the lesson will be split into parts — you add the parts inside the lesson page.</div></div>${mode==='session_code'?`<div style="border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px"><h3 style="margin:0 0 8px">Session access code</h3><div class="field"><label>Numeric code</label><div style="display:flex;gap:8px"><input id="lesson-code" inputmode="numeric" pattern="[0-9]*" maxlength="12" value="${esc(initialCode)}"><button type="button" class="btn secondary" id="generate-lesson-code">Generate</button><button type="button" class="btn secondary" id="copy-lesson-code">Copy</button></div></div><div class="field"><label>Automatic code renewal</label><select id="lesson-code-rotation"><option value="never" ${(l.codeRotation||'never')==='never'?'selected':''}>Never — keep the same code</option><option value="daily" ${l.codeRotation==='daily'?'selected':''}>Every day</option><option value="weekly" ${l.codeRotation==='weekly'?'selected':''}>Every week</option><option value="monthly" ${l.codeRotation==='monthly'?'selected':''}>Every month (30 days)</option></select></div></div>`:''}<div class="actions"><button class="btn primary">${hw?'Save Homework':'Save Lesson'}</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
  if(mode==='session_code'){
    $('generate-lesson-code').onclick=()=>{$('lesson-code').value=generateNumericCode(6)};
    $('copy-lesson-code').onclick=async()=>{try{await navigator.clipboard.writeText($('lesson-code').value);toast('Code copied.')}catch{toast('Select and copy the code.')}};
  }
  $('lesson-form').onsubmit=async e=>{
    e.preventDefault();
    const main=$('lv').value.trim();
    if(main&&!ytId(main))return toast('Enter a valid YouTube link.');
    const p={title:$('lt').value.trim(),videoId:main,order:Number($('lo').value)||1,updatedAt:serverTimestamp()};

      const code=$('lesson-code').value.trim();
      if(!/^\d{4,12}$/.test(code))return toast('Code must contain 4–12 digits.');
      const rotation=$('lesson-code-rotation').value,interval={daily:86400000,weekly:604800000,monthly:2592000000,never:0}[rotation];
      p.accessCode=code;p.codeRotation=rotation;p.codeExpiresAt=interval?Date.now()+interval:null;p.codeUpdatedAt=Date.now();
    }else{p.accessCode='';p.codeRotation='never';p.codeExpiresAt=null;p.codeUpdatedAt=null}
    try{
      if(lid){await updateDoc(doc(db,'courses',c.id,curKind,lid),p);closeModal();toast('Lesson saved.');refresh()}
      else{p.createdAt=serverTimestamp();p.parts=[];const nid=id();await setDoc(doc(db,'courses',c.id,curKind,nid),p);closeModal();toast('Lesson created. Now add its parts.');openLesson(enc(c.id),enc(nid),curKind)}

/* ---------- Resources (inside the lesson page) ---------- */
function resourceDirectUrl(url){if(!url)return url;const m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)||url.match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?`https://drive.google.com/uc?export=download&id=${m[1]}`:url}
function resourceUploader(){return `<div class="resource-upload-card"><div class="resource-name-input"><label for="lesson-resource-name">Resource name</label><input id="lesson-resource-name" type="text" placeholder="Example: Unit 1 Worksheet" maxlength="120"></div><label class="resource-file-picker" for="lesson-resource-file"><span class="resource-file-icon"><span class="mi">upload_file</span></span><span class="resource-file-copy"><strong id="lesson-resource-file-label">Choose a file</strong><span>PDF, Word, PowerPoint, images and other files</span></span><input id="lesson-resource-file" type="file"></label><div class="resource-upload-actions"><button id="lesson-resource-upload" class="btn primary" type="button"><span class="mi">add_circle</span>Add Resource</button></div><div id="lesson-resource-progress" class="progress-wrap" style="display:none"><div id="lesson-resource-fill" class="progress-fill"></div></div><div id="lesson-resource-status"></div></div>`}
function renderLessonResources(resources=[]){
  if(!resources.length)return '<div class="resource-empty" style="margin-top:14px">No resources added yet.</div>';
  return `<div class="resource-list">${resources.map((r,i)=>`<div class="resource-item"><div class="resource-info"><div class="resource-name">${esc(r.name||'Resource')}</div><div class="resource-meta">${esc(r.type||'File')} · ${r.uploadedAt?date(r.uploadedAt):'—'}</div></div><div class="actions"><button class="btn secondary" onclick="window.open('${esc(resourceDirectUrl(r.url))}','_blank')"><span class="mi">download</span>Open</button><button class="btn danger" onclick="deleteLessonResource('${enc(window._resourceCourseId||'')}','${enc(window._resourceLessonId||'')}','${i}')"><span class="mi">delete</span></button></div></div>`).join('')}</div>`;
}
async function uploadLessonResource(cid,lid){
  const input=$('lesson-resource-file'),nameInput=$('lesson-resource-name'),file=input?.files?.[0],displayName=nameInput?.value.trim();
  if(!file)return toast('Choose a file first.');if(!displayName)return toast('Enter the resource name first.');
  const btn=$('lesson-resource-upload'),wrap=$('lesson-resource-progress'),fill=$('lesson-resource-fill'),status=$('lesson-resource-status');
  btn.disabled=true;wrap.style.display='block';fill.style.width='0%';status.className='';status.textContent='Preparing file...';
  const reader=new FileReader();
  reader.onprogress=e=>{if(e.lengthComputable){fill.style.width=((e.loaded/e.total)*50)+'%';status.textContent='Reading file...'}};
  reader.onload=async()=>{
    try{
      fill.style.width='50%';status.textContent='Uploading...';
      const payload={fileName:file.name,mimeType:file.type,file:reader.result.split(',')[1]};
      let prog=50;const timer=setInterval(()=>{if(prog<90){prog+=5;fill.style.width=prog+'%'}},300);
      const response=await fetch(DOCUMENT_UPLOAD_SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});
      clearInterval(timer);const result=await response.json();
      if(result.status!=='success')throw new Error(result.message||'Upload failed');
      const ref=doc(db,'courses',cid,curKind,lid),snap=await getDoc(ref);if(!snap.exists())throw new Error('Lesson not found');
      const resources=snap.data().resources||[];
      resources.push({name:displayName,url:result.fileUrl,type:file.type||'File',originalName:file.name,uploadedAt:new Date().toISOString()});
      await updateDoc(ref,{resources});
      fill.style.width='100%';status.className='resource-success';status.textContent='Resource added successfully.';
      input.value='';nameInput.value='';$('lesson-resource-file-label').textContent='Choose a file';btn.disabled=false;
      $('lesson-resource-list').innerHTML=renderLessonResources((await getDoc(ref)).data().resources||[]);
      setTimeout(()=>{status.textContent='';wrap.style.display='none'},1500);
    }catch(error){console.error(error);status.className='resource-error';status.textContent='Could not upload resource: '+error.message;btn.disabled=false}
  };
  reader.onerror=()=>{status.className='resource-error';status.textContent='Could not read the file.';btn.disabled=false};
  reader.readAsDataURL(file);
}
window.deleteLessonResource=async(a,b,index)=>{
  const cid=dec(a),lid=dec(b),i=Number(index);if(!confirm('Delete this resource?'))return;
  try{const ref=doc(db,'courses',cid,curKind,lid),snap=await getDoc(ref);if(!snap.exists())return toast('Lesson not found.');const resources=snap.data().resources||[];if(i<0||i>=resources.length)return;resources.splice(i,1);await updateDoc(ref,{resources});toast('Resource deleted.');$('lesson-resource-list').innerHTML=renderLessonResources((await getDoc(ref)).data().resources||[])}catch(error){console.error(error);toast('Could not delete resource.')}
};

/* ---------- Quizzes ---------- */
function quizForm(cid,q={},qid=''){
  modal(qid?'Edit Quiz':'Add Quiz',`<form id="quiz-form"><div class="field"><label>Quiz name</label><input id="quiz-title" maxlength="150" required value="${esc(q.title||'')}"></div><div class="field"><label>Google Form link</label><input id="quiz-url" type="url" required value="${esc(q.formUrl||'')}" placeholder="https://docs.google.com/forms/d/.../viewform"><div class="hint">The form must accept responses and allow embedding.</div></div><div class="field"><label>Exam duration (minutes)</label><input id="quiz-duration" type="number" min="1" max="300" value="${Number(q.durationMinutes)||30}" required></div><div class="field"><label>Order</label><input id="quiz-order" type="number" min="1" value="${Number(q.order)||1}" required></div><div class="actions"><button class="btn primary">Save Quiz</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
  $('quiz-form').onsubmit=async e=>{
    e.preventDefault();const url=$('quiz-url').value.trim();
    if(!/^https:\/\/docs\.google\.com\/forms\//i.test(url))return toast('Enter a Google Forms URL.');
    const data={title:$('quiz-title').value.trim(),formUrl:url,durationMinutes:Math.max(1,Math.min(300,Number($('quiz-duration').value)||30)),order:Number($('quiz-order').value)||1,updatedAt:serverTimestamp()};
    try{if(qid)await updateDoc(doc(db,'courses',cid,'quizzes',qid),data);else await addDoc(collection(db,'courses',cid,'quizzes'),{...data,createdAt:serverTimestamp()});closeModal();toast('Quiz saved.');refresh()}catch(err){console.error(err);toast('Could not save quiz.')}
  };
}
window.newQuiz=async e=>{const cid=dec(e),n=(await getDocs(collection(db,'courses',cid,'quizzes'))).size;quizForm(cid,{order:n+1})};
window.editQuiz=async(a,b)=>{const cid=dec(a),qid=dec(b),s=await getDoc(doc(db,'courses',cid,'quizzes',qid));if(s.exists())quizForm(cid,s.data(),qid)};
window.deleteQuiz=async(a,b)=>{if(!confirm('Delete this quiz?'))return;try{await deleteDoc(doc(db,'courses',dec(a),'quizzes',dec(b)));toast('Quiz deleted.');refresh()}catch{toast('Could not delete quiz.')}};

/* ---------- Students: list with search ---------- */
let allStudents=[];
function studentRowsHtml(list){
  if(!list.length)return `<tr><td colspan="6"><div class="empty">No students found.</div></td></tr>`;
  return list.map(u=>{const paused=u.accountPaused===true,pending=u.verificationStatus==="pending";return `<tr class="row-click" onclick="openStudent('${enc(u.id)}')"><td><strong>${esc(u.fullName||'—')}</strong></td><td>${esc(u.email||'—')}</td><td>${esc(u.phone||'—')}</td><td>${date(u.createdAt)}</td><td><span class="badge ${pending?'warn':paused?'bad':'ok'}">${pending?'Pending verification':u.verificationStatus==='rejected'?'Rejected':paused?'Paused':'Active'}</span></td><td><button class="btn secondary" onclick="event.stopPropagation();openStudent('${enc(u.id)}')"><span class="mi">person</span>Open</button></td></tr>`}).join('');
}
window.filterStudents=value=>{
  const q=String(value||'').trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const list=!q?allStudents:allStudents.filter(u=>String(u.fullName||'').toLowerCase().includes(q)||String(u.email||'').toLowerCase().includes(q)||String(u.phone||'').toLowerCase().includes(q)||(qd&&String(u.phone||'').replace(/\D/g,'').includes(qd)));
  $('students-body').innerHTML=studentRowsHtml(list);$('students-count').textContent=`${list.length} of ${allStudents.length} student(s)`;
};
async function students(){
  const snap=await getDocs(collection(db,'users'));
  allStudents=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.role==='student').sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt));
  const pending=allStudents.filter(u=>u.verificationStatus==="pending");
  $('content').innerHTML=`${pending.length?`<div class="panel" style="margin-bottom:14px;border-color:#f3d4b9"><div class="section-head"><div><h2>Verification requests</h2><div class="muted">${pending.length} student request(s) waiting for your review.</div></div><span class="badge warn">Pending</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Email</th><th>Student phone</th><th>Parent phone</th><th>Submitted</th><th>Decision</th></tr></thead><tbody>${pending.map(u=>`<tr><td><strong>${esc(u.fullName||'—')}</strong></td><td>${esc(u.email||'—')}</td><td>${esc(u.phone||'—')}</td><td>${esc(u.parentPhone||'—')}</td><td>${date(u.createdAt)}</td><td><div class="actions"><button class="btn primary sm" onclick="verifyStudent('${enc(u.id)}',true)">Approve</button><button class="btn danger sm" onclick="verifyStudent('${enc(u.id)}',false)">Reject</button></div></td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="panel"><div class="section-head"><div><h2>Students</h2><div id="students-count" class="muted">${allStudents.length} of ${allStudents.length} student(s)</div></div></div><div class="search-box"><span class="mi">search</span><input id="student-search" type="search" placeholder="Search by name, phone or email" oninput="filterStudents(this.value)" autocomplete="off"></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody id="students-body">${studentRowsHtml(allStudents)}</tbody></table></div></div>`;
}

window.verifyStudent=async (e,approve)=>{
  const sid=dec(e);
  if(!approve&&!confirm("Reject this verification request? The request will remain recorded."))return;
  try{await updateDoc(doc(db,'users',sid),{verificationStatus:approve?'approved':'rejected',verifiedAt:approve?serverTimestamp():null,updatedAt:serverTimestamp()});toast(approve?'Student account approved.':'Request rejected.');await load('students')}
  catch(err){console.error(err);toast('Could not update verification status.')}
};
/* ---------- Student page ---------- */
const openCards=new Set();
window.trackCard=(k,o)=>{o?openCards.add(k):openCards.delete(k)};
async function studentPage(sid){
  view={name:'student',sid};
  const us=await getDoc(doc(db,'users',sid));
  if(!us.exists()){$('content').innerHTML='<div class="panel"><div class="empty">Student not found.</div></div>';return}
  const u={id:sid,...us.data()},paused=u.accountPaused===true;
  const [cSnap,eSnap,gSnap,bSnap]=await Promise.all([getDocs(collection(db,'courses')),getDocs(query(collection(db,'enrollments'),where('studentId','==',sid))),getDocs(collection(db,'users',sid,'codeGrants')),getDocs(collection(db,'users',sid,'accessBlocks'))]);
  const courseList=(await Promise.all(cSnap.docs.map(async d=>({id:d.id,...d.data(),lessons:await fetchLessons(d.id)})))).sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
  const enr={};eSnap.docs.forEach(d=>{const x=d.data();enr[x.courseId]=x});
  const grants={};gSnap.docs.forEach(d=>{if(d.data().active===true)grants[d.id]=true});
  const blocks={};bSnap.docs.forEach(d=>{if(d.data().blocked===true)blocks[d.id]=true});
  const S=enc(sid);
  const card=c=>{
    const mode=modeOf(c),C=enc(c.id);
    const paidOk=enr[c.id]?.status==='approved',courseGrant=!!grants[`${c.id}_course`];
    const lessonGrants=c.lessons.filter(l=>grants[`${c.id}_${l.id}`]);
    const courseBlocked=!!blocks[`${c.id}_course`];
    const courseAccess=mode==='free'||(mode==='paid'&&paidOk)||(mode==='course_code'&&courseGrant);
    const hasAccess=courseAccess||(mode==='session_code'&&lessonGrants.length>0);
    const relevant=!!enr[c.id]||courseGrant||lessonGrants.length>0||Object.keys(blocks).some(k=>k.startsWith(c.id+'_'));
    let detail='',accessBtn='';
    if(mode==='free')detail='Free course — open to every student.';
    if(mode==='paid'){detail=enr[c.id]?`Purchase status: ${esc(enr[c.id].status||'—')}`:'Not purchased.';accessBtn=`<button class="btn sm ${paidOk?'danger':'primary'}" onclick="stEnroll('${S}','${C}',${paidOk})"><span class="mi">${paidOk?'person_remove':'lock_open'}</span>${paidOk?'Remove access':'Grant access'}</button>`}
    if(mode==='course_code'){detail=courseGrant?'Entered the course code.':'Has not entered the course code.';accessBtn=`<button class="btn sm ${courseGrant?'danger':'primary'}" onclick="stGrant('${S}','${C}','',${courseGrant})"><span class="mi">${courseGrant?'person_remove':'lock_open'}</span>${courseGrant?'Remove access':'Grant access'}</button>`}
    if(mode==='session_code')detail=`${lessonGrants.length} of ${c.lessons.length} lesson(s) unlocked by code.`;
    const status=courseBlocked?'<span class="badge bad">Suspended</span>':hasAccess?'<span class="badge ok">Has access</span>':'<span class="badge">No access</span>';
    const lessonsHtml=c.lessons.map(l=>{
      const L=enc(l.id),lb=!!blocks[`${c.id}_${l.id}`],lg=!!grants[`${c.id}_${l.id}`];
      const open=!courseBlocked&&!lb&&(courseAccess||lg);
      const st=courseBlocked?'<span class="badge bad">Course suspended</span>':lb?'<span class="badge bad">Suspended</span>':open?'<span class="badge ok">Open</span>':'<span class="badge">Locked</span>';
      return `<div class="acc-lesson"><div><strong>${esc(l.title||'Lesson')}</strong> ${st}</div><div class="actions">${mode==='session_code'?`<button class="btn sm ${lg?'danger':'secondary'}" onclick="stGrant('${S}','${C}','${L}',${lg})">${lg?'Remove access':'Unlock lesson'}</button>`:''}<button class="btn sm ${lb?'primary':'secondary'}" onclick="stBlock('${S}','${C}','${L}',${lb})"><span class="mi">${lb?'play_arrow':'pause'}</span>${lb?'Resume lesson':'Suspend lesson'}</button></div></div>`;
    }).join('')||'<div class="muted" style="padding:8px 0">No lessons in this course.</div>';
    return {relevant:relevant||courseBlocked,html:`<div class="acc-card"><div class="acc-head"><div><strong>${esc(c.title||'Untitled')}</strong> <span class="badge">${esc(modeLabel(c))}</span> ${status}<div class="muted" style="font-size:12px;margin-top:5px">${detail}</div></div><div class="actions">${accessBtn}<button class="btn sm ${courseBlocked?'primary':'secondary'}" onclick="stBlock('${S}','${C}','',${courseBlocked})"><span class="mi">${courseBlocked?'play_arrow':'pause'}</span>${courseBlocked?'Resume course':'Suspend course'}</button></div></div><details ${openCards.has(c.id)?'open':''} ontoggle="trackCard('${esc(c.id)}',this.open)"><summary>Lessons (${c.lessons.length})</summary>${lessonsHtml}</details></div>`};
  };
  const cards=courseList.map(card),mine=cards.filter(x=>x.relevant),other=cards.filter(x=>!x.relevant);
  $('content').innerHTML=`${crumbs([['Students',"load('students')"],[u.fullName||'Student',null]])}
  <div class="panel"><div class="section-head"><div><h2>${esc(u.fullName||'Student')}</h2><div class="muted">Student account</div></div><div class="actions"><button class="btn ${paused?'primary':'secondary'}" onclick="toggleStudentPause('${S}',${paused})"><span class="mi">${paused?'play_arrow':'pause'}</span>${paused?'Resume':'Pause'} account</button><button class="btn secondary" onclick="editStudent('${S}')"><span class="mi">edit</span>Edit</button><button class="btn danger" onclick="deleteStudent('${S}')"><span class="mi">delete</span></button></div></div>
  <div class="info-grid"><div><div class="k">Email</div><div class="v">${esc(u.email||'—')}</div></div><div><div class="k">Student phone</div><div class="v">${esc(u.phone||'—')}</div></div><div><div class="k">Parent phone</div><div class="v">${esc(u.parentPhone||'—')}</div></div><div><div class="k">Created</div><div class="v">${date(u.createdAt)}</div></div><div><div class="k">Status</div><div class="v"><span class="badge ${paused?'bad':'ok'}">${paused?'Paused':'Active'}</span></div></div></div></div>
  <div class="panel"><div class="section-head"><div><h2>Student instruction</h2><div class="muted">A personal instruction or note visible to this student.</div></div><button class="btn primary" onclick="editStudentInstruction('${S}')"><span class="mi">edit</span>Edit instruction</button></div><div style="white-space:pre-wrap;line-height:1.8;color:var(--muted)">${esc(u.instruction||'No instruction added yet.')}</div></div>
  <div class="panel"><div class="section-head"><div><h2>Courses & lessons</h2><div class="muted">Courses the student bought or unlocked with a code, and the lessons opened for them. Suspend or resume any course or lesson.</div></div></div>${mine.length?mine.map(x=>x.html).join(''):'<div class="empty">This student has not bought or unlocked anything yet.</div>'}
  ${other.length?`<details style="margin-top:14px" ${openCards.has('__other')?'open':''} ontoggle="trackCard('__other',this.open)"><summary style="cursor:pointer;font-weight:800;margin-bottom:12px">Other courses (${other.length}) — grant access or suspend</summary>${other.map(x=>x.html).join('')}</details>`:''}</div>`;
}
const act=async(fn,msg,sid)=>{try{await fn();toast(msg);await studentPage(sid)}catch(e){console.error(e);toast('Could not update the student.')}};
window.stBlock=(s,c,l,isBlocked)=>{const sid=dec(s),cid=dec(c),lid=dec(l),key=`${cid}_${lid||'course'}`,ref=doc(db,'users',sid,'accessBlocks',key);return act(()=>isBlocked?deleteDoc(ref):setDoc(ref,{courseId:cid,lessonId:lid||'',blocked:true,blockedAt:serverTimestamp()}),isBlocked?'Resumed.':'Suspended.',sid)};
window.stGrant=(s,c,l,isGranted)=>{const sid=dec(s),cid=dec(c),lid=dec(l)||'course',ref=doc(db,'users',sid,'codeGrants',`${cid}_${lid}`);return act(()=>setDoc(ref,{courseId:cid,lessonId:lid,active:!isGranted,grantedBy:'admin',grantedAt:serverTimestamp()},{merge:true}),isGranted?'Access removed.':'Access granted.',sid)};
window.stEnroll=(s,c,isActive)=>{const sid=dec(s),cid=dec(c),ref=doc(db,'enrollments',`${sid}_${cid}`);return act(()=>setDoc(ref,{studentId:sid,courseId:cid,status:isActive?'revoked':'approved',adminGranted:true,updatedAt:serverTimestamp()},{merge:true}),isActive?'Access removed.':'Access granted.',sid)};
window.toggleStudentPause=async(e,isPaused)=>{const sid=dec(e);try{const ref=doc(db,'users',sid),s=await getDoc(ref);if(!s.exists()||s.data().role!=='student')return toast('Student account not found.');await updateDoc(ref,{accountPaused:!isPaused,updatedAt:serverTimestamp()});toast(isPaused?'Student account resumed.':'Student account paused.');refresh()}catch(error){console.error(error);toast('Could not update the student account.')}};
window.editStudentInstruction=async e=>{
  const sid=dec(e),s=await getDoc(doc(db,'users',sid));if(!s.exists())return toast('Student not found.');
  const u=s.data();
  modal('Student Instruction',`<form id="instruction-form"><div class="field"><label>Instruction / personal note</label><textarea id="student-instruction" placeholder="Write the instruction for this student...">${esc(u.instruction||'')}</textarea><div class="hint">This note is saved on this student's account.</div></div><div class="actions"><button class="btn primary">Save instruction</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
  $('instruction-form').onsubmit=async ev=>{ev.preventDefault();try{await updateDoc(doc(db,'users',sid),{instruction:$('student-instruction').value.trim(),instructionUpdatedAt:serverTimestamp()});closeModal();toast('Instruction saved.');await studentPage(sid)}catch(err){console.error(err);toast('Could not save instruction.')}};
};
window.editStudent=async e=>{
  const sid=dec(e),s=await getDoc(doc(db,'users',sid));if(!s.exists())return toast('Student not found.');const u=s.data();
  modal('Edit Student',`<form id="student-form"><div class="form-grid"><div class="field"><label>Full Name</label><input id="sn" value="${esc(u.fullName)}" required></div><div class="field"><label>Email</label><input id="se" type="email" value="${esc(u.email)}" required></div><div class="field"><label>Student Phone</label><input id="sp" value="${esc(u.phone||'')}"></div><div class="field"><label>Parent / Guardian Phone</label><input id="spp" value="${esc(u.parentPhone||'')}"></div><div class="field full"><label>Student Instruction</label><textarea id="si">${esc(u.instruction||'')}</textarea></div><div class="field"><label>New password (optional)</label><input id="spw" type="text" minlength="6" placeholder="Leave empty to keep the current one"></div></div><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`);
  $('student-form').onsubmit=async ev=>{ev.preventDefault();try{const p={fullName:$('sn').value.trim(),email:$('se').value.trim().toLowerCase(),phone:$('sp').value.trim(),parentPhone:$('spp').value.trim(),instruction:$('si').value.trim(),updatedAt:serverTimestamp()};const pw=$('spw').value;if(pw){if(pw.length<6)return toast('Password must be at least 6 characters.');p.passwordHash=await hashPassword(pw)}await updateDoc(doc(db,'users',sid),p);closeModal();toast('Student updated.');refresh()}catch{toast('Could not save student.')}};
};
window.deleteStudent=async e=>{if(!confirm('Delete this student account?'))return;try{await deleteDoc(doc(db,'users',dec(e)));toast('Student deleted.');load('students')}catch{toast('Could not delete student.')}};

/* ---------- Payments ---------- */
async function payments(){
  const settings=await getDoc(doc(db,'settings','paymentNumbers'));const numbers=settings.exists()?settings.data():{};
  const snap=await getDocs(collection(db,'paymentRequests'));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt));
  $('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Payment numbers</h2><div class="muted">Students see these numbers during checkout.</div></div></div><form id="payment-numbers-form"><div class="form-grid"><div class="field"><label>Vodafone Cash number</label><input id="vodafone-number" value="${esc(numbers.vodafone||'')}" placeholder="01xxxxxxxxx"></div><div class="field"><label>InstaPay address or number</label><input id="instapay-number" value="${esc(numbers.instapay||'')}" placeholder="name@instapay"></div></div><button class="btn primary">Save payment numbers</button></form></div><div class="panel"><div class="section-head"><div><h2>Payment requests</h2><div class="muted">Review submitted transfers and unlock courses after approval.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Course(s)</th><th>Amount</th><th>Method</th><th>Sender</th><th>Status</th><th></th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><strong>${esc(r.studentName||'—')}</strong><br><span class="muted">${esc(r.studentEmail||'')}</span></td><td>${esc((r.courseTitles||[]).join(', ')||'—')}</td><td>${Number(r.amount||0).toFixed(2)} EGP</td><td>${esc(r.method||'—')}</td><td>${esc(r.senderPhone||'—')}</td><td><span class="badge">${esc(r.status||'pending')}</span></td><td><div class="actions">${r.receiptBase64?`<button class="btn secondary" onclick="viewReceipt('${enc(r.id)}')"><span class="mi">image</span>Receipt</button>`:''}${r.status==='pending'?`<button class="btn primary" onclick="reviewPayment('${enc(r.id)}','approved')">Approve</button><button class="btn danger" onclick="reviewPayment('${enc(r.id)}','rejected')">Reject</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">No payment requests yet.</div></td></tr>`}</tbody></table></div></div>`;
  $('payment-numbers-form').onsubmit=async e=>{e.preventDefault();try{await setDoc(doc(db,'settings','paymentNumbers'),{vodafone:$('vodafone-number').value.trim(),instapay:$('instapay-number').value.trim(),updatedAt:serverTimestamp()},{merge:true});toast('Payment numbers saved.')}catch{toast('Could not save payment numbers.')}};
}
window.viewReceipt=async e=>{const s=await getDoc(doc(db,'paymentRequests',dec(e)));if(!s.exists())return toast('Payment request not found.');const r=s.data();modal('Payment receipt',`<div class="receipt-view"><img src="${esc(r.receiptBase64||'')}" alt="Payment receipt" style="max-width:100%"><p><strong>${esc(r.senderName||'')}</strong> - ${esc(r.senderPhone||'')}</p></div>`)};
window.reviewPayment=async(e,status)=>{
  const rid=dec(e);const reason=status==='rejected'?prompt('Reason for rejection (optional):')||'Payment could not be verified.':'';
  try{
    const s=await getDoc(doc(db,'paymentRequests',rid));if(!s.exists())return toast('Payment request not found.');const r=s.data();
    if(status==='approved'){for(const courseId of r.courseIds||[])await setDoc(doc(db,'enrollments',`${r.studentId}_${courseId}`),{studentId:r.studentId,courseId,status:'approved',paymentRequestId:rid,approvedAt:serverTimestamp()},{merge:true})}
    await updateDoc(doc(db,'paymentRequests',rid),{status,rejectionReason:reason,reviewedAt:serverTimestamp()});
    toast(status==='approved'?'Payment approved and course unlocked.':'Payment rejected.');load('payments')
  }catch(error){console.error(error);toast('Could not update the payment request.')}
};

/* ---------- Contact ---------- */
async function contact(){
  const s=await getDoc(doc(db,'settings','contact'));const c=s.exists()?s.data():{};
  $('content').innerHTML=`<div class="panel"><div class="section-head"><div><h2>Contact Information</h2><div class="muted">These details are used by the public contact page.</div></div></div><form id="cf"><div class="form-grid"><div class="field"><label>Email</label><input id="ce" value="${esc(c.email||'')}"></div><div class="field"><label>Phone</label><input id="cp" value="${esc(c.phone||'')}"></div><div class="field"><label>WhatsApp</label><input id="cw" value="${esc(c.whatsapp||'')}"></div><div class="field"><label>Address</label><input id="ca" value="${esc(c.address||'')}"></div><div class="field"><label>Facebook link</label><input id="cfacebook" type="url" value="${esc(c.facebook||'')}" placeholder="https://facebook.com/..."></div><div class="field"><label>TikTok link</label><input id="ctiktok" type="url" value="${esc(c.tiktok||'')}" placeholder="https://tiktok.com/@..."></div><div class="field"><label>YouTube link</label><input id="cyoutube" type="url" value="${esc(c.youtube||'')}" placeholder="https://youtube.com/@..."></div><div class="field full"><label>Message</label><textarea id="cm">${esc(c.message||'')}</textarea></div></div><button class="btn primary">Save Contact</button></form></div>`;
  $('cf').onsubmit=async e=>{e.preventDefault();try{await setDoc(doc(db,'settings','contact'),{email:$('ce').value.trim(),phone:$('cp').value.trim(),whatsapp:$('cw').value.trim(),address:$('ca').value.trim(),facebook:$('cfacebook').value.trim(),tiktok:$('ctiktok').value.trim(),youtube:$('cyoutube').value.trim(),message:$('cm').value.trim(),updatedAt:serverTimestamp()},{merge:true});toast('Contact information saved.')}catch(error){console.error(error);toast('Could not save contact information.')}};
}
load('overview');

</script></body></html>
